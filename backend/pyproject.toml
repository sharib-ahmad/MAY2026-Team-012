[project]
name = "verdeza-backend"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
# do NOT blanket-exclude migrations. Generated migrations are candidate
# code that gets human-reviewed, so they must at least pass syntax, import and
# format checks. We only relax the lint RULES that fight autogenerated style
# (see per-file-ignores), never skip the files entirely.

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM"]
ignore = ["B008"]  # FastAPI's Depends() in argument defaults is the documented idiom.

[tool.ruff.lint.per-file-ignores]
# Alembic autogenerates these; allow its conventional unused-import and
# long-line style, but everything else (real syntax/logic issues) still fails.
"alembic/versions/*" = ["E501", "F401", "I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# the warnings-as-errors gate now actually exists in config, not only
# on a manual CLI flag. SQLAlchemy and app warnings fail the run. Add narrowly
# justified ignores here as they arise, never a blanket ignore.
filterwarnings = [
    "error",
    # anyio/starlette TestClient can leave a memory stream unclosed during
    # teardown when a route raises; this is test-infrastructure noise, not a
    # product warning. Scoped as narrowly as the library allows.
    "ignore:Unclosed.*MemoryObjectReceiveStream:ResourceWarning",
    # DeprecationWarnings from third-party libs we do not control can be added
    # here with a comment explaining why, e.g.:
    # "ignore::DeprecationWarning:passlib.*",
]
addopts = "-ra --strict-markers --strict-config --cov=app --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=80"
markers = [
    "unit: pure logic, no database",
    "integration: exercises the database",
    "api: endpoint level, through the HTTP client",
    "security: authorization and session negative cases",
    "boundary: values at or across a defined limit",
    # Registered now so later-sprint reference tests collect without error:
    "idempotency: repeat-safety of a state-changing operation",
    "lifecycle: illegal status transitions",
    "concurrency: simultaneous writers",
    "resilience: behaviour when an external dependency fails",
]

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["alembic/*", "tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
# real gate on real coverage (currently ~85%). Raise per sprint.
fail_under = 80
