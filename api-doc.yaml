# Verdeza canonical OpenAPI contract
# MAY2026-Team-012 | Sprint 1 (Milestone 3) and Sprint 2 (Milestone 4)
# Canonical file name: api-doc.yaml
#
# Reconciliation note (docs/sprint1-2-openapi-final): every operation below was
# verified directly against the implemented routers on origin/main as of this
# branch's base commit, not against the original Sprint 1 story text or the
# Sprint 2 proposal in docs/qa/sprint-plan.md / endpoint-inventory.md. Several
# planned paths from those planning documents were never built as designed;
# several implemented paths were never planned under those names. Where an
# operation's real behaviour diverges from its user story's acceptance
# criteria, the divergence is called out in the operation description and
# tracked in docs/qa/defect-log.md — the contract below describes what `main`
# actually does, not what the story asked for.
openapi: 3.0.3
info:
  title: Verdeza API
  version: 1.1.0
  description: >-
    Canonical OpenAPI contract for Verdeza, MAY2026-Team-012, covering every
    public operation implemented on `main` across Sprint 1 (Milestone 3) and
    Sprint 2 (Milestone 4). This document now spans both sprints, so Sprint
    and user-story traceability is carried per operation in `x-traceability`
    rather than once at the document level. Every protected operation uses
    Bearer authentication, the standard safe error envelope and a
    request-correlation ID on every response.

    Vocabulary note: the original Sprint 1 contract intended public-facing
    names such as `complaints`/`ward_code` in place of the internal
    `tickets`/`zone_id` table names. The implemented routes did not carry
    that renaming through consistently — several complaint operations are
    served at literal `/tickets` paths. This document names routes as they
    exist on `main`, not as originally intended.

    Legacy-alias note: FastAPI-level singular-noun aliases marked
    `include_in_schema=False` in the admin router (for example
    `/api/v1/admin/user`, `/api/v1/admin/ward`) are intentionally absent here
    for the same reason the application itself hides them from its live
    OpenAPI document. Distinct from those, a small number of canonical routes
    are reachable at more than one *schema-visible* mount (for example the
    citizen complaints router is mounted at both `/api/v1/user/tickets` and
    `/api/v1/complaints/tickets`); those are documented once at a chosen
    canonical path with the equivalent mount(s) noted in the description.
  x-project:
    team: MAY2026-Team-012
    scope: Sprint 1 (Milestone 3) and Sprint 2 (Milestone 4)
    storyAllocation:
      sprint1:
        milestone: 3
        stories: 11
        acceptanceCriteria: 57
      sprint2:
        milestone: 4
        stories: 14
        acceptanceCriteria: 80
    source: docs/qa/sprint-plan.md (team-recorded allocation; not re-derived here)
  x-external-integrations:
  - provider: OpenRouteService (Optimization API)
    purpose: Computes a road-following optimised visiting order and route geometry
      for a collector's pending stops.
    callingModule: backend/app/features/collection_ops/ors_client.py (ORSClient),
      invoked from GET /api/v1/collector/route
    verdezaEndpoint: GET /api/v1/collector/route
    relatedStories:
    - '7.3'
    configuration: Server-side ORS_API_KEY; never sent to or callable from the frontend.
    fallbackBehaviour: On a missing key, a non-2xx response or any client exception,
      the backend falls back to a nearest-neighbour ordering over straight-line
      (Haversine) segments and sets is_degraded=true with a degraded_notice string
      on the response. The request never fails outright because of the external
      call.
  - provider: Google Gemini (generativelanguage.googleapis.com, gemini-3.5-flash)
    purpose: Powers "EcoBot", a citizen-facing assistant that answers questions about
      the citizen's own pickups, tickets, credits/badges and reuse activity using
      function-calling tools that read the caller's own records.
    callingModule: backend/app/features/users/service.py (execute_chatbot_turn)
    verdezaEndpoint: POST /api/v1/user/chatbot/message
    relatedStories: []
    configuration: Server-side GEMINI_API_KEY, read from the process environment
      (not the typed Settings object used elsewhere). Never returned to the client.
    fallbackBehaviour: A missing key returns a safe "maintenance mode" reply instead
      of failing the request; a non-200 upstream response or absent candidates
      returns a safe generic reply. This is a genuine GenAI integration — it is
      documented because it exists in current code, not because the grading
      rubric mentions GenAI as an example.
    note: Not mapped to any of the 25 user stories in user-stories.txt; it is an
      implemented capability outside the story set.
servers:
- url: /
  description: Current deployment origin
tags:
- name: System
  description: Liveness and readiness probes.
- name: Authentication
  description: Login, current-user identity, and public self-registration.
- name: Users
  description: Administrator-controlled user provisioning and lifecycle management.
- name: Wards
  description: Canonical ward and zone reference data, and administrator ward management.
- name: Administration
  description: Supporting administrator dashboard and audit-log operations.
- name: Credit Factors
  description: Administrator configuration of per-category credit and CO2 factors.
- name: Citizen Pickups
  description: Citizen bulk/institutional pickup requests and self-service tracking.
- name: Complaints
  description: Citizen complaint lodging, self-read, reopening, and municipal resolution.
- name: Collector Operations
  description: Collection-worker route, stop-progress, delay, waste-issue and notification
    operations.
- name: Citizen Schedules
  description: Citizen-facing view of their own generated daily pickup schedule.
- name: Notifications
  description: Authenticated in-application notifications, per role namespace.
- name: Citizen Support
  description: Citizen impact/credits summary, home dashboard, reference data, account
    deletion and the EcoBot assistant.
- name: Manager Support
  description: Ward-scoped municipal-officer dashboard, worker management and bulk-pickup
    assignment.
- name: Manager Batches
  description: Municipal-officer view and assignment of collected material batches.
- name: Recycler Batches
  description: Recycler view and lifecycle actions on batches assigned to them.
- name: Civic Reuse Exchange
  description: Citizen reuse-item listings and claims, and municipal-officer moderation.
- name: Public Tracking
  description: Unauthenticated reference-code look-up shared across pickups, bulk
    requests and complaints.
paths:
  /health:
    get:
      tags:
      - System
      operationId: getHealth
      summary: Check application liveness
      description: Returns process liveness without depending on the database.
      x-traceability:
        requirement: platform-liveness
        contractStatus: implemented
      security: []
      responses:
        '200':
          description: Application process is alive.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /ready:
    get:
      tags:
      - System
      operationId: getReadiness
      summary: Check application and database readiness
      description: Runs a lightweight `SELECT 1` and returns a safe 503 response
        when the database is unavailable.
      x-traceability:
        requirement: platform-readiness
        contractStatus: implemented
      security: []
      responses:
        '200':
          description: Application and database are ready.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/login:
    post:
      tags:
      - Authentication
      operationId: loginUser
      summary: Authenticate a provisioned or self-registered user
      description: Authenticates an account and returns a Bearer access token. Unknown
        users, incorrect passwords and disabled or deleted accounts return the same
        generic 401 response so no distinction is observable from outside.
      x-traceability:
        stories:
        - '5.1'
        contractStatus: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: citizen@example.com
              password: StrongPass123!
      responses:
        '200':
          description: Authentication succeeded.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/register:
    post:
      tags:
      - Authentication
      operationId: registerUser
      summary: Publicly self-register a new account
      description: >-
        Creates an account and immediately returns a Bearer token, with no
        authentication required to call it.

        Known contract defect (see docs/qa/defect-log.md): the `role` field
        accepts any canonical role name, including `MUNICIPAL_OFFICER` and
        `SYSTEM_ADMIN` (via the `MANAGER`/`ADMIN` aliases or the raw enum
        name), with no server-side restriction. This lets an unauthenticated
        caller self-provision a municipal-officer or system-admin account,
        which directly contradicts Story 5.1's "System Admin provisions
        accounts through a secure admin panel" and platform rule R1. This
        operation is documented as it actually behaves; the fix belongs in
        the defect log, not in this contract.
      x-traceability:
        requirement: public-self-registration
        contractStatus: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              name: Asha Verma
              email: asha.verma@example.com
              phone: '+919876543210'
              password: StrongPass123!
              role: CITIZEN
              zone_id: 5a20f588-bf4f-4b45-bca8-c603c02e0c4f
      responses:
        '200':
          description: Account created and authenticated.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/me:
    get:
      tags:
      - Authentication
      operationId: getCurrentUser
      summary: Return the authenticated caller's profile
      description: Returns canonical public identity fields. Internal fields such
        as password_hash, token_version, zone_id and deleted_at are never returned.
        Missing, malformed, expired, forged or revoked tokens return 401.
      x-traceability:
        requirement: platform-authenticated-profile
        contractStatus: implemented
      x-required-roles:
      - CITIZEN
      - COLLECTION_WORKER
      - MUNICIPAL_OFFICER
      - RECYCLER
      - SYSTEM_ADMIN
      x-authorization:
        scope: current-authenticated-user
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Current authenticated user profile.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedUser'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/wards:
    get:
      tags:
      - Wards
      operationId: listWardsAdmin
      summary: List wards with manager and worker counts (admin)
      description: Returns every ward with its assigned manager name and collector
        headcount, ordered by ward code. Functionally identical to `GET
        /api/v1/admin/wards`, served by a separate router mount.
      x-traceability:
        stories:
        - '5.1'
        requirement: supporting-reference-data
        contractStatus: implemented
      x-required-roles:
      - SYSTEM_ADMIN
      x-authorization:
        scope: system-administration
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Ward list with total count.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WardListResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/zones:
    get:
      tags:
      - Wards
      operationId: listZoneReferences
      summary: List all zones as a plain reference list
      description: >-
        Returns every zone's id and a combined `"CODE - Name"` label, with no
        authentication required. Used to populate ward-selection dropdowns
        (for example during self-registration). Unlike every other ward/user
        listing in this contract, this operation carries no `security`
        requirement in the implementation — it is publicly readable.
      x-traceability:
        requirement: public-zone-reference-data
        contractStatus: implemented
      security: []
      responses:
        '200':
          description: Zone reference list.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ZoneReference'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/wards:
    get:
      tags:
      - Wards
      operationId: listAdminWards
      summary: List wards with manager and worker counts
      description: Returns every ward with its assigned manager name and collector
        headcount, ordered by ward code.
      x-traceability:
        stories:
        - '5.1'
        requirement: supporting-ward-administration
        contractStatus: implemented
      x-required-roles:
      - SYSTEM_ADMIN
      x-authorization:
        scope: system-administration
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Administrator ward list.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WardListResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
      - Wards
      operationId: createAdminWard
      summary: Create a ward
      description: Creates a ward with a unique code. Duplicate codes return 409.
      x-traceability:
        stories:
        - '5.1'
        requirement: supporting-ward-administration
        contractStatus: implemented
      x-required-roles:
      - SYSTEM_ADMIN
      x-authorization:
        scope: system-administration
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WardCreateRequest'
            example:
              code: WARD-09
              name: Ward Nine
              sectors: Sector 9
      responses:
        '201':
          description: Ward created.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WardPublic'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/wards/{ward_id}:
    patch:
      tags:
      - Wards
      operationId: updateAdminWard
      summary: Update a ward
      description: Replaces name, sectors and manager assignment. A supplied manager_id
        must belong to an existing, non-deleted MUNICIPAL_OFFICER, or the request
        is rejected. Every change is audit-logged.
      x-traceability:
        stories:
        - '5.1'
        requirement: supporting-ward-administration
        contractStatus: implemented
      x-required-roles:
      - SYSTEM_ADMIN
      x-authorization:
        scope: system-administration
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/WardId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WardUpdateRequest'
            example:
              name: Ward Nine Central
              sectors: null
              manager_id: null
      responses:
        '200':
          description: Ward updated.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WardPublic'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
      - Wards
      operationId: deleteAdminWard
      summary: Delete an unused ward
      description: Deletes a ward only when zero users reference it; otherwise returns
        400. The deletion is audit-logged.
      x-traceability:
        stories:
        - '5.1'
        requirement: supporting-ward-administration
        contractStatus: implemented
      x-required-roles:
      - SYSTEM_ADMIN
      x-authorization:
        scope: system-administration
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/WardId'
      responses:
        '204':
          description: Ward deleted.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          description: The ward still has users assigned to it, or the ward ID is
            malformed.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/dashboard:
    get:
      tags:
      - Administration
      operationId: getAdminDashboard
      summary: Return the full user list and system counters
      description: Returns every non-deleted user (unbounded — no pagination is applied
        server-side) alongside registered-user, ward and placeholder error/uptime
        counters.
      x-traceability:
        stories:
        - '5.1'
        requirement: supporting-administrator-dashboard
        contractStatus: implemented
      x-required-roles:
      - SYSTEM_ADMIN
      x-authorization:
        scope: system-administration
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Administrator dashboard.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDashboardResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/logs:
    get:
      tags:
      - Administration
      operationId: listAdminAuditLogs
      summary: List append-only audit records
      description: >-
        Returns the most recent audit_logs rows, newest first, bounded by
        `limit`. Audit rows are written only for admin/manager account,
        ward, ticket and worker actions (R2). Collector route/stop actions,
        recycler batch actions and reuse moderation actions record actor
        and timestamp on the affected entity itself rather than in this
        central log — they will not appear here.
      x-traceability:
        stories:
        - '5.1'
        requirement: platform-auditability
        contractStatus: implemented
      x-required-roles:
      - SYSTEM_ADMIN
      x-authorization:
        scope: system-administration
      security:
      - bearerAuth: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 100
      responses:
        '200':
          description: Bounded audit log page.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogsResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/account:
    post:
      tags:
      - Users
      operationId: createAdminAccount
      summary: Provision a MUNICIPAL_OFFICER or SYSTEM_ADMIN account
      description: Creates a staff account. Any other role value is rejected with
        403. Duplicate email or phone returns 409. The action is audit-logged.
      x-traceability:
        stories:
        - '5.1'
        acceptanceCriteria:
        - 5.1-AC1
        - 5.1-AC3
        contractStatus: implemented
      x-required-roles:
      - SYSTEM_ADMIN
      x-authorization:
        scope: system-administration
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserCreateRequest'
            example:
              name: Priya Officer
              email: priya.officer@example.com
              phone: '+919876543211'
              password: StrongPass123!
              role: MUNICIPAL_OFFICER
              zone_id: 5a20f588-bf4f-4b45-bca8-c603c02e0c4f
      responses:
        '201':
          description: Staff account created.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - user
                properties:
                  user:
                    $ref: '#/components/schemas/AuthenticatedUser'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/users:
    post:
      tags:
      - Users
      operationId: createAdminUser
      summary: Provision a user of any role
      description: Creates a CITIZEN, COLLECTION_WORKER, MUNICIPAL_OFFICER, RECYCLER
        or SYSTEM_ADMIN account. Email and phone uniqueness and a valid ward reference
        are enforced server-side.
      x-traceability:
        stories:
        - '5.1'
        acceptanceCriteria:
        - 5.1-AC1
        - 5.1-AC3
        contractStatus: implemented
      x-required-roles:
      - SYSTEM_ADMIN
      x-authorization:
        scope: system-administration
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserCreateRequest'
            example:
              name: Asha Verma
              email: asha.verma@example.com
              phone: '+919876543210'
              password: StrongPass123!
              role: CITIZEN
              zone_id: 5a20f588-bf4f-4b45-bca8-c603c02e0c4f
      responses:
        '201':
          description: User created.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - user
                properties:
                  user:
                    $ref: '#/components/schemas/AuthenticatedUser'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/users/{user_id}:
    patch:
      tags:
      - Users
      operationId: updateAdminUser
      summary: Update a managed user's profile or role
      description: Applies a partial update. Changing email or role increments token_version,
        invalidating the user's existing sessions (AC6). Demoting the last active
        SYSTEM_ADMIN is rejected with 409.
      x-traceability:
        stories:
        - '5.1'
        acceptanceCriteria:
        - 5.1-AC2
        - 5.1-AC3
        - 5.1-AC6
        - 5.1-AC8
        contractStatus: implemented
      x-required-roles:
      - SYSTEM_ADMIN
      x-authorization:
        scope: system-administration
        lifecycleGuards:
        - last-active-administrator
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserUpdateRequest'
            example:
              name: Asha V. Verma
              role: MUNICIPAL_OFFICER
      responses:
        '200':
          description: User updated.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - message
                properties:
                  message:
