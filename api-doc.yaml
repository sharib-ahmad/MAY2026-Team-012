      operationId: listAllReuseDonationsForManager
      summary: List every listing (any status) in the officer's managed wards
      x-traceability:
        stories:
        - '6.2'
        requirement: manager-listing-history
        contractStatus: implemented
      x-required-roles:
      - MUNICIPAL_OFFICER
      x-authorization:
        scope: ward-scoped
        ward: listing.zone_id must be in the officer's managed wards
      security:
      - bearerAuth: []
      responses:
        '200':
          description: All listings in the officer's wards.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DonationResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/reuse/donations/{listing_id}/review:
    post:
      tags:
      - Civic Reuse Exchange
      operationId: reviewReuseDonation
      summary: Approve or reject a pending listing
      description: >-
        status must be AVAILABLE or REJECTED (any other value returns 422).
        Rejecting without a non-blank rejection_reason returns 422 (AC2,
        AC3). Approving publishes the listing to the public shelf (AC1) and
        notifies the lister either way. A listing outside the officer's
        managed wards returns 403; a listing not in PENDING_APPROVAL is not
        separately guarded — the review functions do not check
        listing.status before applying the review (AC6's "moderatable state
        only" guard is not enforced here).
      x-traceability:
        stories:
        - '6.2'
        acceptanceCriteria:
        - 6.2-AC1
        - 6.2-AC2
        - 6.2-AC3
        contractStatus: implemented
      x-required-roles:
      - MUNICIPAL_OFFICER
      x-authorization:
        scope: ward-scoped
        ward: listing.zone_id must be in the officer's managed wards
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ListingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DonationReviewRequest'
            example:
              status: REJECTED
              rejection_reason: Photo does not match the description.
      responses:
        '200':
          description: Listing reviewed.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DonationResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/reuse/manager/claims/pending:
    get:
      tags:
      - Civic Reuse Exchange
      operationId: listPendingReuseClaims
      summary: List pending claim requests in the officer's managed wards
      description: The moderation queue for Story 6.4. Same no-managed-wards fallback
        caveat as the pending-donations queue.
      x-traceability:
        stories:
        - '6.4'
        requirement: manager-claim-queue
        contractStatus: implemented
      x-required-roles:
      - MUNICIPAL_OFFICER
      x-authorization:
        scope: ward-scoped
        ward: claim's listing.zone_id must be in the officer's managed wards
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Pending claims.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClaimResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/reuse/claims/{claim_id}/review:
    post:
      tags:
      - Civic Reuse Exchange
      operationId: reviewReuseClaim
      summary: Approve or reject a pending claim
      description: >-
        status must be APPROVED or REJECTED (AC3 required for rejection).
        Approving completes the listing, notifies both parties, and
        auto-rejects every other pending claim on the same listing so a claim
        is never decided twice for the same listing (AC6, in spirit — there
        is no explicit "second decision on the same claim" guard beyond the
        claim no longer being PENDING once decided). Rejecting returns the
        listing to AVAILABLE. A claim outside the officer's managed wards
        returns 403.
      x-traceability:
        stories:
        - '6.4'
        acceptanceCriteria:
        - 6.4-AC1
        - 6.4-AC2
        - 6.4-AC3
        - 6.4-AC5
        contractStatus: implemented
      x-required-roles:
      - MUNICIPAL_OFFICER
      x-authorization:
        scope: ward-scoped
        ward: claim's listing.zone_id must be in the officer's managed wards
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ClaimId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimReviewRequest'
            example:
              status: APPROVED
              note: Coordinate pickup directly with the donor.
      responses:
        '200':
          description: Claim reviewed.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/track/{reference}:
    get:
      tags:
      - Public Tracking
      operationId: trackByReference
      summary: Look up a ticket, bulk pickup or pickup by its reference code
      description: >-
        Publicly resolves a reference code (matched upper-cased,
        case-insensitively) against tickets, bulk-pickup requests and
        pickups, in that order, and returns a merged status/timeline view.
        No authentication and no ownership check is applied.

        Security note (see docs/qa/defect-log.md): because this endpoint is
        both unauthenticated and ownership-unchecked, anyone who knows or
        guesses a reference code can read the associated citizen_name,
        zone_name and status — a minor PII exposure inconsistent with R1's
        "record ownership enforced at the access-control layer" for the
        equivalent authenticated tracking endpoints
        (`GET /api/v1/user/pickups/{id}/tracking`).
      x-traceability:
        requirement: public-reference-tracking
        contractStatus: implemented
      security: []
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
          maxLength: 40
      responses:
        '200':
          description: Matched record.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicTrackingResponse'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token issued by POST /api/v1/auth/login or POST /api/v1/auth/register.
  headers:
    XRequestID:
      description: UUID correlation identifier returned on every response and equal
        to error.request_id in error bodies.
      schema:
        type: string
        format: uuid
  parameters:
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WorkerId:
      name: worker_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WardId:
      name: ward_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PickupId:
      name: pickup_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StopId:
      name: stop_id
      in: path
      required: true
      description: DailyPickupStop ID.
      schema:
        type: string
        format: uuid
    NotificationId:
      name: notification_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BatchId:
      name: batch_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ListingId:
      name: listing_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ClaimId:
      name: claim_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    AuthenticationRequired:
      description: Missing, malformed, expired, forged, revoked or otherwise invalid
        Bearer authentication.
      headers:
        WWW-Authenticate:
          description: Bearer authentication challenge.
          schema:
            type: string
            example: Bearer
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: AUTHENTICATION_REQUIRED
              message: Could not validate credentials
              request_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
    Forbidden:
      description: The authenticated caller is not authorised for the requested role,
        ward, or object scope.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: FORBIDDEN
              message: You do not have permission to perform this action.
              request_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
    ResourceNotFound:
      description: The resource does not exist or is intentionally hidden outside
        the caller's authorised scope.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: RESOURCE_NOT_FOUND
              message: The requested resource was not found.
              request_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
    Conflict:
      description: Duplicate resource, protected lifecycle state, repeated decision
        or illegal state transition.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: CONFLICT
              message: That action is not allowed in the resource's current state.
              request_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
    ValidationError:
      description: The request body, path or query input failed validation.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: VALIDATION_ERROR
              message: The request contains invalid data.
              request_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              details:
              - loc:
                - body
                - name
                type: string_too_short
    ServiceUnavailable:
      description: The database is temporarily unavailable.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: DATABASE_UNAVAILABLE
              message: The service is temporarily unavailable.
              request_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
    InternalError:
      description: Unexpected server error. Internal exception details, SQL, file
        paths and secrets are never exposed.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: INTERNAL_ERROR
              message: An unexpected error occurred.
              request_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
  schemas:
    ErrorDetail:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - request_id
      properties:
        code:
          type: string
          minLength: 1
          example: VALIDATION_ERROR
        message:
          type: string
          minLength: 1
          example: The request contains invalid data.
        request_id:
          type: string
          format: uuid
        details:
          type: array
          nullable: true
          items:
            type: object
            additionalProperties: true
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
    HealthResponse:
      type: object
      additionalProperties: false
      required:
      - status
      - env
      properties:
        status:
          type: string
          enum:
          - ok
        env:
          type: string
          example: local
    ReadyResponse:
      type: object
      additionalProperties: false
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - ready
    UserRole:
      type: string
      enum:
      - CITIZEN
      - COLLECTION_WORKER
      - MUNICIPAL_OFFICER
      - RECYCLER
      - SYSTEM_ADMIN
    UserStatus:
      type: string
      enum:
      - ACTIVE
      - DISABLED
    LoginRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
          writeOnly: true
          example: StrongPass123!
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
      - name
      - email
      - password
      - phone
      - role
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          writeOnly: true
        phone:
          type: string
          minLength: 5
          maxLength: 20
        address:
          type: string
          nullable: true
          maxLength: 500
        zone_id:
