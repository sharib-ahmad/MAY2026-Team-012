      - aging_complaints
      - pending_bulk_pickups
      - active_workers
      properties:
        assigned_wards:
          type: integer
          minimum: 0
        open_complaints:
          type: integer
          minimum: 0
        aging_complaints:
          type: integer
          minimum: 0
        pending_bulk_pickups:
          type: integer
          minimum: 0
        active_workers:
          type: integer
          minimum: 0
    ManagerDashboard:
      type: object
      additionalProperties: false
      required:
      - stats
      - wards
      - complaints
      - bulk_pickups
      - workers
      - notifications
      properties:
        stats:
          $ref: '#/components/schemas/ManagerDashboardStats'
        wards:
          type: array
          items:
            $ref: '#/components/schemas/WardReference'
        complaints:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/ComplaintPublic'
        bulk_pickups:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/BulkPickupPublic'
        workers:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/UserPublic'
        notifications:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/NotificationPublic'
