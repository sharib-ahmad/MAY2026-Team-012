  /api/v1/recycler/batches/{batch_id}/process:
    post:
      tags:
      - Recycler Batches
      operationId: processRecyclerBatch
      summary: Mark a batch processed and award recycling credits
      description: >-
        Transitions PROCESSING to PROCESSED. For every pickup in the batch,
        awards one Credit ledger row per (pickup_id, PICKUP_RECYCLING) —
        enforced by a database uniqueness constraint, satisfying Story 8.1
        AC6's idempotency rule — using
        `amount = round(weight * credit_rate, 2)` and
        `co2_saved = round(weight * co2_factor, 3)` from the category's
        current CreditFactor row (AC1, AC2, AC4). A category with no
        configured factor awards 0 credits rather than failing (AC9).

        Known gaps against Story 8.1: the trigger is batch processing (a
        recycler action, potentially days after collection), not the pickup
        reaching COMPLETED as AC1 specifies; `weight` always falls back to
        `estimated_weight` because no endpoint ever sets a pickup's
        `actual_weight` (AC7's "estimated weight is never used" does not
        hold in the current implementation); the credit_rate/co2_factor
        used are whatever is configured *at processing time*, not frozen at
        an earlier "completion" moment (AC3); and there is no code path that
        reverses a Credit's status on later un-completion (AC10–AC12) — the
        `CreditStatus.REVERSED` value exists but nothing ever sets it.
      x-traceability:
        stories:
        - '4.3'
        - '8.1'
        acceptanceCriteria:
        - 8.1-AC2
        - 8.1-AC4
        - 8.1-AC6
        - 8.1-AC9
        contractStatus: implemented
      x-required-roles:
      - RECYCLER
      x-authorization:
        scope: own-records
      security:
