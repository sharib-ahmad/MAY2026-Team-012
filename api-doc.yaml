    ComplaintStatus:
      type: string
      description: Canonical stored statuses. Reopening transitions RESOLVED back to OPEN; REOPENED is an audit
        event, not a stored status.
      enum:
      - OPEN
      - IN_PROGRESS
      - RESOLVED
      - CLOSED
    ComplaintIssueType:
      type: string
      enum:
      - MISSED_PICKUP
      - OVERFLOW
      - MIXED_WASTE
      - DELAY
      - OTHER
    ComplaintEventType:
      type: string
      enum:
      - STATUS_CHANGED
      - REOPENED
    ComplaintCreateRequest:
      type: object
      additionalProperties: false
      required:
      - issue_type
      - ward_code
      - description
      properties:
        issue_type:
          $ref: '#/components/schemas/ComplaintIssueType'
        ward_code:
          type: string
          minLength: 1
          maxLength: 20
          pattern: .*\S.*
        description:
          type: string
          minLength: 10
          maxLength: 500
          pattern: .*\S.*
    ComplaintResolutionRequest:
      type: object
      additionalProperties: false
      required:
      - status
      - resolution_notes
      properties:
        status:
          type: string
          enum:
          - RESOLVED
        resolution_notes:
          type: string
          minLength: 1
          maxLength: 500
          pattern: .*\S.*
    ComplaintStatusEvent:
      type: object
      additionalProperties: false
      required:
      - event_type
      - from_status
      - to_status
      - actor
      - occurred_at
      properties:
        event_type:
          $ref: '#/components/schemas/ComplaintEventType'
        from_status:
          $ref: '#/components/schemas/ComplaintStatus'
        to_status:
          $ref: '#/components/schemas/ComplaintStatus'
        actor:
          $ref: '#/components/schemas/UserReference'
        occurred_at:
          type: string
          format: date-time
    ComplaintPublic:
      type: object
      additionalProperties: false
      required:
      - id
      - ref_code
      - status
      - issue_type
      - ward_code
      - description
      - complainant
      - is_aging
      - created_at
      - last_status_changed_at
      properties:
        id:
          type: string
          format: uuid
        ref_code:
          type: string
          minLength: 1
          maxLength: 30
          example: CMP-9B254CE1
        status:
          $ref: '#/components/schemas/ComplaintStatus'
        issue_type:
          $ref: '#/components/schemas/ComplaintIssueType'
        ward_code:
          type: string
          maxLength: 20
        description:
          type: string
          maxLength: 500
        complainant:
          $ref: '#/components/schemas/UserReference'
        is_aging:
          type: boolean
          description: True only for unresolved complaints at or beyond the configured aging threshold.
        created_at:
          type: string
          format: date-time
        resolution_notes:
          type: string
          nullable: true
          maxLength: 500
        resolved_by:
          type: object
          allOf:
          - $ref: '#/components/schemas/UserReference'
          nullable: true
        resolved_at:
          type: string
          format: date-time
          nullable: true
        last_status_changed_at:
          type: string
          format: date-time
        last_status_changed_by:
          type: object
          allOf:
          - $ref: '#/components/schemas/UserReference'
          nullable: true
        status_history:
          type: array
          items:
            $ref: '#/components/schemas/ComplaintStatusEvent'
    ComplaintPage:
      type: object
      additionalProperties: false
      required:
      - items
      - page
      - page_size
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ComplaintPublic'
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
