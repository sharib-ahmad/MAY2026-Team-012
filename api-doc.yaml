          description: Free text, case-insensitively mapped onto FURNITURE, ELECTRONICS,
            CLOTHING, BOOKS, HOUSEHOLD or OTHER; unrecognised values fall back to
            OTHER rather than being rejected.
        description:
          type: string
          nullable: true
          maxLength: 500
        condition:
          type: string
          description: Free text mapped onto GOOD or FAIR (values other than NEW/LIKE_NEW/GOOD
            fall back to FAIR rather than being rejected).
        address:
          type: string
          nullable: true
          maxLength: 200
        images:
          type: array
          default: []
          items:
            type: string
            description: An already-hosted image URL. This API performs no format
              or size validation.
