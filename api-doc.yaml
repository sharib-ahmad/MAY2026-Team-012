# Verdeza canonical OpenAPI contract
# MAY2026-Team-012 | Milestone 3 (Sprint 1)
# Canonical file name: api-doc.yaml
# Public registration and legacy route aliases are intentionally absent.

openapi: 3.0.3
info:
  title: Verdeza API
  version: 1.0.0
  description: Canonical OpenAPI contract for Verdeza, MAY2026-Team-012, Milestone 3 (Sprint 1). Public API vocabulary
    uses complaints, wards and ward_code; internal database names such as tickets, zones and zone_id are not exposed.
    Accounts are provisioned by a SYSTEM_ADMIN; public self-registration and legacy authentication aliases are outside
    the approved contract. Every protected operation uses Bearer authentication, the standard safe error envelope
    and request correlation IDs.
  x-project:
    team: MAY2026-Team-012
    milestone: 3
    sprint: 1
    stories: 11
    acceptanceCriteria: 57
servers:
- url: /
  description: Current deployment origin
tags:
- name: System
  description: Liveness and readiness probes.
- name: Authentication
  description: Canonical login and current-user identity operations.
- name: Users
  description: Administrator-controlled user provisioning and lifecycle management.
- name: Wards
  description: Canonical ward reference and administrator ward management.
- name: Administration
  description: Supporting administrator dashboard and audit operations.
- name: Manager Support
  description: Ward-scoped municipal-officer dashboard and worker support operations.
- name: Sorting Guide
  description: Static waste-segregation guidance and administrator content maintenance.
- name: Schedules
  description: Ward collection schedule look-up.
- name: Bulk Pickups
  description: Bulk or institutional pickup requests and controlled lifecycle actions.
- name: Routes
  description: Collection-worker route checklist and route-stop progress.
- name: Delays
  description: Traceable route-stop delay records.
- name: Waste Issues
  description: Mixed-waste and hazardous-waste issue recording and review.
- name: Notifications
  description: Authenticated in-application notifications.
- name: Complaints
  description: Citizen complaints, municipal review, resolution and reopening.
paths:
  /health:
    get:
      tags:
      - System
      operationId: getHealth
      summary: Check application liveness
      description: Returns process liveness without depending on the database.
      x-traceability:
        milestone: 3
        sprint: 1
        requirement: platform-liveness
        contractStatus: approved
      security: []
      responses:
        '200':
          description: Application process is alive.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /ready:
    get:
      tags:
      - System
      operationId: getReadiness
      summary: Check application and database readiness
      description: Runs the approved lightweight database readiness check and returns a safe 503 response when unavailable.
      x-traceability:
        milestone: 3
        sprint: 1
        requirement: platform-readiness
        contractStatus: approved
      security: []
      responses:
        '200':
          description: Application and database are ready.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/login:
    post:
      tags:
      - Authentication
      operationId: loginUser
      summary: Authenticate a provisioned user
      description: Authenticates an administrator-provisioned account and returns a Bearer access token. Unknown
        users, incorrect passwords and disabled or deleted accounts return the same generic 401 response. Public
        registration, legacy /api/v1/login and refresh tokens are not part of this contract.
      x-traceability:
        milestone: 3
        sprint: 1
        requirement: platform-authentication
        contractStatus: approved
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: citizen@example.com
              password: StrongPass123!
      responses:
        '200':
          description: Authentication succeeded.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/me:
    get:
      tags:
      - Authentication
      operationId: getCurrentUser
      summary: Return the authenticated public user profile
      description: 'Returns only canonical public identity fields. Internal fields such as password_hash, token_version,
        zone_id, deleted_at and security state are never returned. Missing, malformed, expired, forged or revoked
        tokens return 401 with WWW-Authenticate: Bearer.'
      x-traceability:
        milestone: 3
        sprint: 1
        requirement: platform-authenticated-profile
        contractStatus: approved
      x-required-roles:
      - CITIZEN
      - COLLECTION_WORKER
      - MUNICIPAL_OFFICER
      - RECYCLER
      - SYSTEM_ADMIN
      x-authorization:
        scope: current-authenticated-user
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Current public user profile.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPublic'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/wards:
    get:
      tags:
      - Wards
      operationId: listWardReferences
      summary: List canonical ward reference data
      description: Returns a deterministic list of active ward identifiers and codes used by administrator provisioning
        and Sprint 1 workflows.
      x-traceability:
        milestone: 3
        sprint: 1
        stories:
        - '5.1'
        requirement: supporting-reference-data
        contractStatus: approved
      x-required-roles:
      - SYSTEM_ADMIN
      x-authorization:
        scope: system-administration
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Ward reference list.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WardReference'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/users:
    get:
      tags:
      - Users
      operationId: listAdminUsers
      summary: List provisioned users
      description: Returns a bounded deterministic administrator view of user profiles without internal authentication
        or deletion fields.
      x-traceability:
        milestone: 3
        sprint: 1
        stories:
        - '5.1'
        acceptanceCriteria:
        - 5.1-AC1
        - 5.1-AC4
        contractStatus: approved
      x-required-roles:
      - SYSTEM_ADMIN
      x-authorization:
        scope: system-administration
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      - name: role
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/UserRole'
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/UserStatus'
      - name: ward_code
        in: query
        required: false
        schema:
          type: string
          maxLength: 20
      responses:
        '200':
          description: Bounded user list.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
      - Users
      operationId: createAdminUser
      summary: Provision a managed user account
      description: Creates a CITIZEN, COLLECTION_WORKER, MUNICIPAL_OFFICER, RECYCLER or SYSTEM_ADMIN account. Email
        and phone uniqueness, canonical role values, optional ward assignment, password byte limits, audit creation
        and transaction rollback are enforced server-side.
      x-traceability:
        milestone: 3
        sprint: 1
        stories:
        - '5.1'
        acceptanceCriteria:
        - 5.1-AC1
        - 5.1-AC2
        - 5.1-AC3
        - 5.1-AC4
        contractStatus: approved
      x-required-roles:
      - SYSTEM_ADMIN
      x-authorization:
        scope: system-administration
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
            example:
              name: Asha Verma
              email: asha.verma@example.com
              phone: '+919876543210'
              password: StrongPass123!
              role: CITIZEN
              ward_code: W-04
      responses:
        '201':
          description: User created.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPublic'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/users/{user_id}:
    patch:
      tags:
      - Users
      operationId: updateAdminUser
      summary: Update a managed user profile or role
      description: Applies an allow-listed partial update. Protected fields cannot be supplied. Role or ward changes
        invalidate existing sessions, and the last active SYSTEM_ADMIN cannot be demoted.
      x-traceability:
        milestone: 3
        sprint: 1
        stories:
        - '5.1'
        acceptanceCriteria:
        - 5.1-AC2
        - 5.1-AC3
        - 5.1-AC4
        - 5.1-AC6
        contractStatus: approved
      x-required-roles:
      - SYSTEM_ADMIN
      x-authorization:
        scope: system-administration
        lifecycleGuards:
        - last-active-administrator
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
            example:
              name: Asha V. Verma
              role: MUNICIPAL_OFFICER
              ward_code: W-04
      responses:
        '200':
          description: User updated.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPublic'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/users/{user_id}/status:
    patch:
      tags:
      - Users
      operationId: updateAdminUserStatus
      summary: Disable or re-enable a managed user
      description: Changes ACTIVE or DISABLED status, increments token_version to revoke old sessions and records
        an audit entry. The last active SYSTEM_ADMIN cannot be disabled.
      x-traceability:
        milestone: 3
        sprint: 1
        stories:
        - '5.1'
        acceptanceCriteria:
        - 5.1-AC3
        - 5.1-AC4
        - 5.1-AC7
        contractStatus: approved
      x-required-roles:
      - SYSTEM_ADMIN
      x-authorization:
        scope: system-administration
        lifecycleGuards:
        - last-active-administrator
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserStatusUpdateRequest'
            example:
              status: DISABLED
      responses:
        '200':
          description: User status updated.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPublic'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/wards:
    get:
      tags:
      - Wards
      operationId: listAdminWards
      summary: List wards with administrator details
      description: Returns canonical ward codes and supported administrator-facing fields in deterministic code
        order.
      x-traceability:
        milestone: 3
        sprint: 1
        stories:
        - '5.1'
        requirement: supporting-ward-administration
        contractStatus: approved
      x-required-roles:
      - SYSTEM_ADMIN
      x-authorization:
        scope: system-administration
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Administrator ward list.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminWardPublic'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
      - Wards
      operationId: createAdminWard
      summary: Create a canonical ward
      description: Creates a unique canonical uppercase ward code. Text values are trimmed and whitespace-only values
        are rejected.
      x-traceability:
        milestone: 3
        sprint: 1
        stories:
        - '5.1'
        requirement: supporting-ward-administration
        contractStatus: approved
      x-required-roles:
      - SYSTEM_ADMIN
      x-authorization:
        scope: system-administration
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WardCreateRequest'
            example:
              code: W-09
              name: Ward Nine
              sectors: Sector 9
      responses:
        '201':
          description: Ward created.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminWardPublic'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/wards/{ward_id}:
    patch:
      tags:
      - Wards
      operationId: updateAdminWard
      summary: Update a ward
      description: Updates allow-listed ward fields and records the change in the audit log.
      x-traceability:
        milestone: 3
        sprint: 1
        stories:
        - '5.1'
        requirement: supporting-ward-administration
        contractStatus: approved
      x-required-roles:
      - SYSTEM_ADMIN
      x-authorization:
        scope: system-administration
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/WardId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WardUpdateRequest'
            example:
              name: Ward Nine Central
              sectors: null
      responses:
        '200':
          description: Ward updated.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminWardPublic'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
      - Wards
      operationId: deleteAdminWard
      summary: Delete an unused ward
      description: Deletes a ward only when no users or active workflow records depend on it. The deletion is audited.
      x-traceability:
        milestone: 3
        sprint: 1
        stories:
        - '5.1'
        requirement: supporting-ward-administration
        contractStatus: approved
      x-required-roles:
      - SYSTEM_ADMIN
      x-authorization:
        scope: system-administration
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/WardId'
      responses:
        '204':
          description: Ward deleted.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/dashboard:
    get:
      tags:
      - Administration
      operationId: getAdminDashboard
      summary: Return system administration dashboard data
      description: Returns bounded system-wide counts needed for administrator oversight without exposing secrets
        or raw internal exception data.
      x-traceability:
        milestone: 3
        sprint: 1
        stories:
        - '5.1'
        requirement: supporting-administrator-dashboard
        contractStatus: approved
      x-required-roles:
      - SYSTEM_ADMIN
      x-authorization:
        scope: system-administration
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Administrator dashboard.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDashboard'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/logs:
    get:
      tags:
      - Administration
      operationId: listAdminAuditLogs
      summary: List bounded administrator audit records
      description: Returns append-only audit records with controlled pagination and no secret values.
      x-traceability:
        milestone: 3
        sprint: 1
        stories:
        - '5.1'
        requirement: platform-auditability
        contractStatus: approved
      x-required-roles:
      - SYSTEM_ADMIN
      x-authorization:
        scope: system-administration
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Limit'
      - name: action
        in: query
        required: false
        schema:
          type: string
          maxLength: 80
      - name: entity_type
        in: query
        required: false
        schema:
          type: string
          maxLength: 40
      responses:
        '200':
          description: Bounded audit-log page.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogPage'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/manager/dashboard:
    get:
      tags:
      - Manager Support
      operationId: getManagerDashboard
      summary: Return an assigned-ward manager dashboard
      description: Returns only records and aggregates from the municipal officer’s assigned wards. Complaint rows
        are bounded and newest-first, unresolved complaints expose is_aging at the exact configured threshold, and
        notification items are limited to the authenticated manager.
      x-traceability:
        milestone: 3
        sprint: 1
        stories:
        - '2.2'
        acceptanceCriteria:
        - 2.2-AC1
        - 2.2-AC2
        - 2.2-AC3
        - 2.2-AC4
        contractStatus: approved
      x-required-roles:
      - MUNICIPAL_OFFICER
      x-authorization:
        scope: assigned-wards-only
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Ward-scoped manager dashboard.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagerDashboard'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/manager/workers/{worker_id}:
    patch:
      tags:
      - Manager Support
      operationId: updateManagerWorker
      summary: Update a worker in an assigned ward
      description: Updates allow-listed worker fields within the manager’s assigned ward. Status changes revoke
        old sessions and every mutation is audited atomically.
      x-traceability:
        milestone: 3
        sprint: 1
        stories:
        - '5.1'
        requirement: supporting-manager-worker-management
        contractStatus: approved
      x-required-roles:
      - MUNICIPAL_OFFICER
      x-authorization:
        scope: assigned-wards-only
        targetRole: COLLECTION_WORKER
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/WorkerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerUpdateRequest'
            example:
              name: Updated Worker
              phone: '+919876543299'
              status: DISABLED
      responses:
        '200':
          description: Worker updated.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPublic'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
      - Manager Support
      operationId: deleteManagerWorker
      summary: Soft-delete an unassigned worker in an assigned ward
      description: Soft-deletes only an eligible unassigned collection worker, revokes active sessions and writes
        the audit record in the same transaction.
      x-traceability:
        milestone: 3
        sprint: 1
        stories:
        - '5.1'
        requirement: supporting-manager-worker-management
        contractStatus: approved
      x-required-roles:
      - MUNICIPAL_OFFICER
      x-authorization:
        scope: assigned-wards-only
        targetRole: COLLECTION_WORKER
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/WorkerId'
      responses:
        '204':
          description: Worker soft-deleted.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/sorting-guide:
    get:
      tags:
      - Sorting Guide
      operationId: getSortingGuide
      summary: Return the static waste-sorting guide
      description: Returns deterministic guidance for wet, dry, recyclable, e-waste, sanitary and domestic hazardous-like
        waste categories.
      x-traceability:
        milestone: 3
        sprint: 1
        stories:
        - '3.1'
        acceptanceCriteria:
        - 3.1-AC1
        - 3.1-AC2
        - 3.1-AC3
        contractStatus: approved
