        caller's live pickup count/weight — they are never persisted to the
        `badges`/`user_badges` tables that exist in the schema (with a
        `(user_id, badge_id)` uniqueness constraint ready for AC2's
        idempotency requirement), carry no category (AC5) or icon_key/earned_at
        metadata (AC6), and are never revoked, which happens to satisfy AC7
        only because nothing is ever persisted to revoke.
