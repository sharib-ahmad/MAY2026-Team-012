              status: RESOLVED
              resolution_notes: Area cleared and verified.
      responses:
        '200':
          description: Complaint resolved.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintPublic'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/complaints/{complaint_id}/reopen:
    post:
      tags:
      - Complaints
      operationId: reopenComplaint
      summary: Reopen a resolved complaint within the allowed window
      description: Allows only the original complainant to transition RESOLVED back to OPEN within the configured
        window. REOPENED is recorded as an audit event, not stored as a complaint status.
      x-traceability:
        milestone: 3
        sprint: 1
        stories:
        - '2.3'
        acceptanceCriteria:
        - 2.3-AC2
        - 2.3-AC5
        contractStatus: approved
      x-required-roles:
      - CITIZEN
      x-authorization:
        scope: original-complainant-only
        lifecycleGuard: RESOLVED-to-OPEN-within-window
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ComplaintId'
      responses:
        '200':
          description: Complaint reopened; stored status is OPEN.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintPublic'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token issued by POST /api/v1/auth/login.
  headers:
    XRequestID:
      description: UUID correlation identifier returned on every response and equal to error.request_id in error
        bodies.
      schema:
        type: string
        format: uuid
  parameters:
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WorkerId:
      name: worker_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WardId:
      name: ward_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BulkPickupId:
      name: bulk_pickup_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RouteStopId:
      name: route_stop_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ComplaintId:
      name: complaint_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WardCodeQuery:
      name: ward_code
      in: query
      required: true
      description: Canonical ward code; surrounding whitespace is trimmed and matching is case-insensitive.
      schema:
        type: string
        minLength: 1
        maxLength: 20
        example: W-04
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
  responses:
    AuthenticationRequired:
      description: Missing, malformed, expired, forged, revoked or otherwise invalid Bearer authentication.
      headers:
        WWW-Authenticate:
          description: Bearer authentication challenge.
          schema:
            type: string
            example: Bearer
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: AUTHENTICATION_REQUIRED
              message: Authentication is required.
              request_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
    Forbidden:
      description: The authenticated caller is not authorised for the requested role, ward, owner or object scope.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: FORBIDDEN
              message: You do not have permission to perform this action.
              request_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
    ResourceNotFound:
      description: The resource does not exist or is intentionally hidden outside the caller’s authorised scope.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: RESOURCE_NOT_FOUND
              message: The requested resource was not found.
              request_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
    Conflict:
      description: Duplicate resource, protected lifecycle state, repeated decision or illegal state transition.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: ILLEGAL_STATUS_TRANSITION
              message: That status change is not allowed.
              request_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
    ValidationError:
      description: The request body, path or query input failed validation.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: VALIDATION_ERROR
              message: The request contains invalid data.
              request_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              details:
              - loc:
                - body
                - name
                type: string_too_short
    ServiceUnavailable:
      description: The database or a required local service is temporarily unavailable.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: DATABASE_UNAVAILABLE
              message: The service is temporarily unavailable.
              request_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
    InternalError:
      description: Unexpected server error. Internal exception details, SQL, file paths and secrets are never exposed.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: INTERNAL_ERROR
              message: An unexpected error occurred.
              request_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
  schemas:
