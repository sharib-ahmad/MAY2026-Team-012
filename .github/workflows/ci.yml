name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend-check:
    name: frontend-check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend formatting
        run: npm run format:check

      - name: Run frontend lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  api-contract-check:
    name: api-contract-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: "24" }
      - run: npx --yes @redocly/cli@1.34.5 lint api-doc.yaml

  backend-check:
    name: backend-check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: verdeza
          POSTGRES_PASSWORD: verdeza
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verdeza -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      SECRET_KEY: "ci-only-secret-at-least-32-characters-long-000"
      PILOT_TIMEZONE: Asia/Kolkata
      MIGRATION_DATABASE_URL: "postgresql+psycopg://verdeza:verdeza@localhost:5432/verdeza_migration_test"
      PYTEST_DATABASE_URL: "postgresql+psycopg://verdeza:verdeza@localhost:5432/verdeza_pytest_test"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Check dependency compatibility
        run: python -m pip check

      - name: Create isolated test databases
        env:
          PGPASSWORD: verdeza
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U verdeza -d postgres \
            -c "CREATE DATABASE verdeza_migration_test;"
          psql -v ON_ERROR_STOP=1 -h localhost -U verdeza -d postgres \
            -c "CREATE DATABASE verdeza_pytest_test;"

      - name: Run backend lint
        run: ruff check .

      - name: Check backend formatting
        run: ruff format --check .

      - name: Verify migration round trip
        env:
          DATABASE_URL: ${{ env.MIGRATION_DATABASE_URL }}
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
          alembic check

      - name: Run backend tests with coverage
        env:
          DATABASE_URL: ${{ env.PYTEST_DATABASE_URL }}
        run: python -m pytest -q --junitxml=pytest-junit.xml

      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-reports
          path: |
            backend/coverage.xml
            backend/pytest-junit.xml
          if-no-files-found: warn
          retention-days: 7
